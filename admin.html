<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KRADHA Owner Dashboard</title><link rel="stylesheet" href="style.css"><style>body{background:#f7f4f2}.admin{max-width:1200px;margin:auto;padding:35px 5%}.admin h1{font:500 38px 'Playfair Display',serif}.admin-head{display:flex;justify-content:space-between;align-items:center}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border:1px solid #eee;padding:20px}.stat strong{font-size:26px;display:block}.stat span{font-size:10px;color:#888;letter-spacing:1px}.order{padding:20px 0;border-top:1px solid #eee}.order-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.items{background:#faf7f5;padding:12px;margin:12px 0}.status{padding:9px;border:1px solid #ddd}.actions{margin:20px 0}@media(max-width:650px){.stats{grid-template-columns:1fr}.order-grid{grid-template-columns:1fr}}</style></head><body><div class="announcement">KRADHA OWNER DASHBOARD</div><main class="admin"><div class="admin-head"><div><p class="eyebrow">ADMIN</p><h1>Orders</h1></div><button class="primary-btn" onclick="location.href='index.html'">OPEN STORE</button></div><div class="stats"><div class="card stat"><strong id="count">0</strong><span>TOTAL ORDERS</span></div><div class="card stat"><strong id="sales">₹0</strong><span>TOTAL ORDER VALUE</span></div><div class="card stat"><strong id="new">0</strong><span>NEW ORDERS</span></div></div><div class="actions"><button class="primary-btn" onclick="exportOrders()">EXPORT ORDERS</button></div><section class="card"><div id="orders"></div></section></main><script>function money(n){return '₹'+Number(n||0).toLocaleString('en-IN')}function load(){let a=JSON.parse(localStorage.getItem('kradha_orders')||'[]');count.textContent=a.length;sales.textContent=money(a.reduce((s,o)=>s+Number(o.total||0),0));new.textContent=a.filter(o=>(o.status||'New')==='New').length;orders.innerHTML=a.length?a.slice().reverse().map(o=>`<article class="order"><div class="order-grid"><div><b>${o.order}</b><br>${o.name}<br>${o.phone}</div><div><b>${money(o.total)}</b><br>${o.payment}<br>${o.date||''}</div></div><div class="items">${(o.items||[]).map(i=>`${i.name} — ${i.size} — Qty ${i.qty} — ${money(i.lineTotal)}`).join('<br>')}</div><div>Address: ${o.address}</div><br><select class="status" onchange="setStatus('${o.order}',this.value)"><option ${o.status==='New'||!o.status?'selected':''}>New</option><option ${o.status==='Confirmed'?'selected':''}>Confirmed</option><option ${o.status==='Shipped'?'selected':''}>Shipped</option><option ${o.status==='Delivered'?'selected':''}>Delivered</option><option ${o.status==='Cancelled'?'selected':''}>Cancelled</option></select></article>`).join(''):'<div class="empty-state"><h3>No orders yet</h3></div>'}function setStatus(id,v){let a=JSON.parse(localStorage.getItem('kradha_orders')||'[]');let o=a.find(x=>x.order===id);if(o)o.status=v;localStorage.setItem('kradha_orders',JSON.stringify(a));load()}function exportOrders(){let a=localStorage.getItem('kradha_orders')||'[]';let u=URL.createObjectURL(new Blob([a],{type:'application/json'}));let x=document.createElement('a');x.href=u;x.download='kradha-orders.json';x.click();URL.revokeObjectURL(u)}load()</script></body></html>
